version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - type/chore
      - priority/low
      - status/in-review
      - area/infrastructure
    assignees:
      - markheydon
    ignore:
      # Microsoft.OpenApi 3.x is not compatible with ASP.NET Core 10; stay on 2.x until a future ASP.NET release.
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      entity-framework:
        patterns:
          - Microsoft.EntityFrameworkCore.*
          - Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore
          - Npgsql.EntityFrameworkCore.*
        update-types:
          - minor
          - patch
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
        update-types:
          - minor
          - patch
      azure:
        patterns:
          - Azure.*
          - Microsoft.Azure.*
          - Aspire.*
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - OpenTelemetry.*
        update-types:
          - minor
          - patch
      test-packages:
        patterns:
          - coverlet.*
          - Microsoft.NET.Test.Sdk
          - xunit.*
        update-types:
          - minor
          - patch
      identity:
        patterns:
          - Microsoft.Identity.Web*
        update-types:
          - minor
          - patch
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
