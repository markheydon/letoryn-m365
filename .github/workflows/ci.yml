name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TenancyHub.slnx

      - name: Lint
        run: dotnet format TenancyHub.slnx --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build TenancyHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TenancyHub.slnx --configuration Release --no-build --verbosity normal
